title: "[Idea]: "
body:
  - type: markdown
    attributes:
      value: |
        Share an idea or brainstorm new workflows for GitLab Watcher before turning it into a formal feature request.

  - type: textarea
    id: summary
    attributes:
      label: Idea summary
      description: What would you like GitLab Watcher to do, and what problem or workflow does it improve?
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: How do you envision it working?
      description: Describe any CLI options, config settings, GitLab labels, or AI tool integrations you have in mind.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, examples, or related workflows.
    validations:
      required: false

