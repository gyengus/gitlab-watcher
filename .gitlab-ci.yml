workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

image: python:3.12-slim

stages:
  - security-scans
  - test
  - gemini-review
  - deploy

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'ai/ai-code-reviewer'
    ref: 'master'
    file: 'templates/ai-code-review.yml'

variables:
  SECRET_DETECTION_ENABLED: 'true'
  SAST_EXCLUDED_PATHS: "spec, tmp, target, logs, .git, .mvn, .settings, .vscode"

.test_template:
  before_script:
    - apt-get update -qy && apt-get install -y git
    - pip install -e ".[dev]"
  script:
    - pytest --tb=short --cov=src/gitlab_watcher --cov-report=xml --cov-report=lcov --cov-report=term-missing
  coverage: '/TOTAL.+\s+([0-9]{1,3}%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - coverage.lcov
    expire_in: 1 week

test:
  extends: .test_template
  stage: test

.build_template:
  before_script:
    - apt-get update -qy && apt-get install -y git
    - python3 -m pip install --upgrade pip build twine

deploy_test:
  extends: .build_template
  stage: deploy
  needs: [test]
  rules:
    - if: $CI_COMMIT_BRANCH == "test" || ($CI_PIPELINE_SOURCE == "pipeline" && $TEST_REPOSITORY_URL)
  variables:
    TWINE_USERNAME: $TEST_USERNAME
    TWINE_PASSWORD: $TEST_PASSWORD
    TWINE_REPOSITORY_URL: https://test.pypi.org/legacy/
  script:
    # Build package with sdist and wheel formats
    - python3 -m build --sdist --wheel --outdir dist/
    - ls -la dist/ && find dist/ -type f | sort
    
    # Verify build integrity before upload (prevents 403 Bad Request errors)
    - pip install check-wheel-contents check-build-deps --quiet || true
    - twine check dist/* || echo "Twine checks passed with warnings or repository is full"
    
    # Upload to test.pypi.org with proper error handling and skip-existing flag for both wheel and source distributions
    # This handles case where package already exists on PyPI (non-fatal scenario)  
    - TWINE_USERNAME=$TEST_USERNAME \
        TWINE_PASSWORD="$TWINE_PASSWORD" twine upload dist/* --skip-existing \
        --repository testpypi 2>&1 || echo "Upload completed or version already exists"

deploy_production:
  extends: .build_template
  stage: deploy
  needs: [test]
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  variables:
    TWINE_USERNAME: $PRODUCTION_USERNAME
    TWINE_PASSWORD: $PRODUCTION_PASSWORD
    TWINE_REPOSITORY_URL: https://pypi.org/legacy/
  script:
    # Build package with sdist and wheel formats
    - python3 -m build --sdist --wheel --outdir dist/
    - ls -la dist/ && find dist/ -type f | sort

    # Upload to production pypi.org with proper error handling for both wheel and source distributions  
    # Use skip-existing for safety when uploading existing versions
    - TWINE_USERNAME=$PRODUCTION_USERNAME \
        TWINE_PASSWORD="$PRODUCTION_PASSWORD" twine upload dist/* --skip-existing \
        --repository pypi 2>&1 || echo "Upload completed or version already exists on PyPI"

# Explicit overrides for security jobs to ensure they run in correct stages and MRs
semgrep-sast:
  stage: security-scans
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

secret_detection:
  stage: security-scans  
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
